<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hệ Thống Quản Trị Nhân Sự - HRM</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #f0f9ff; }
    #hrm-frame { width: 100%; height: 100%; border: none; display: block; }

    /* Modal Camera chuyên nghiệp */
    #camera-modal {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .camera-box {
      background: white; width: 100%; max-width: 400px; border-radius: 20px;
      padding: 24px 20px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      animation: modalSlideIn 0.25s ease-out;
    }
    @keyframes modalSlideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .camera-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .camera-title { color: #0369a1; font-weight: 700; font-size: 1.05rem; }
    
    /* Thanh trạng thái tinh tế */
    #status-log {
      font-size: 0.88rem; padding: 10px 14px; border-radius: 10px;
      background: #f0f9ff; color: #0284c7; margin-bottom: 14px; font-weight: 500;
      border: 1px solid #bae6fd; text-align: left; display: flex; align-items: center; gap: 8px;
    }
    
    #reader { width: 100%; border-radius: 14px; overflow: hidden; border: 2px dashed #7dd3fc; min-height: 240px; margin-bottom: 16px; background: #f8fafc; }
    
    /* Nút bấm Pill-shaped chuẩn 40px */
    .btn-pill {
      height: 40px; width: 100%; border: none; border-radius: 999px;
      font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: background 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-close { background: #f1f5f9; color: #475569; }
    .btn-close:hover { background: #e2e8f0; }
  </style>
</head>
<body>

  <iframe id="hrm-frame"></iframe>

  <div id="camera-modal">
    <div class="camera-box">
      <div class="camera-header">
        <div class="camera-title" id="modal-user-title">Quét Mã QR Chấm Công</div>
        <span style="font-size: 1.2rem; cursor: pointer; color: #94a3b8;" onclick="dongCuaSo()">&times;</span>
      </div>
      
      <div id="status-log">⏳ Đang khởi động hệ thống...</div>
      
      <div id="reader"></div>
      
      <button class="btn-pill btn-close" onclick="dongCuaSo()">Đóng Camera</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // DÁN LINK WEB APP GOOGLE APPS SCRIPT (/exec) CỦA ANH VÀO ĐÂY:
    // =========================================================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdPmvfpGlZm-OyN4RVkwp_H3jAjN6dQ_xi5xpRn5iaDlYPc7CbjdE4HHeRapfogbaXeQ/exec";

    document.getElementById('hrm-frame').src = GAS_WEB_APP_URL;

    let html5QrCode = null;
    let daQuetXong = false;
    let currentStaff = { maNV: 'NV001', hoTen: 'Nhân viên' };
    let currentGPS = { lat: 0, lng: 0 };

    const cameraModal = document.getElementById('camera-modal');
    const statusLog = document.getElementById('status-log');
    const readerDiv = document.getElementById('reader');

    function setLog(msg, bg = '#f0f9ff', color = '#0284c7', border = '#bae6fd') {
      statusLog.style.background = bg;
      statusLog.style.color = color;
      statusLog.style.borderColor = border;
      statusLog.innerHTML = msg;
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.action === 'OPEN_QR_SCANNER') {
        currentStaff.maNV = event.data.maNV || 'NV001';
        currentStaff.hoTen = event.data.hoTen || 'Nhân viên';
        document.getElementById('modal-user-title').innerText = "Chấm công: " + currentStaff.hoTen;
        moPopupVaLayGPS();
      }
    });

    function moPopupVaLayGPS() {
      daQuetXong = false;
      cameraModal.style.display = 'flex';
      readerDiv.style.display = 'block';
      setLog("📍 Đang định vị GPS và khởi động Camera...");

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentGPS.lat = pos.coords.latitude;
            currentGPS.lng = pos.coords.longitude;
            setLog(`🎯 Đã khóa GPS. Hãy đưa mã QR vào khung ngắm!`);
            batCamera();
          },
          (err) => {
            setLog("⚠️ Không lấy được GPS, đang mở Camera trực tiếp...", "#fef3c7", "#b45309", "#fde68a");
            batCamera();
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else {
        batCamera();
      }
    }

    function batCamera() {
      try {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            if (daQuetXong) return;
            daQuetXong = true;
            readerDiv.style.display = 'none';
            guiDuLieuVeSheet(decodedText);
            try { html5QrCode.stop(); } catch(e) {}
          }
        ).catch(err => {
          setLog("❌ Không thể bật Camera. Hãy cấp quyền Camera trên trình duyệt!", "#fee2e2", "#b91c1c", "#fecaca");
        });
      } catch (e) {}
    }

    function guiDuLieuVeSheet(qrCode) {
      setLog(`🔄 Đang ghi mã [${qrCode}] vào Google Sheets...`, "#fef3c7", "#b45309", "#fde68a");

      const url = GAS_WEB_APP_URL 
        + "?action=chamcong"
        + "&maNV=" + encodeURIComponent(currentStaff.maNV)
        + "&hoTen=" + encodeURIComponent(currentStaff.hoTen)
        + "&qrCode=" + encodeURIComponent(qrCode)
        + "&lat=" + encodeURIComponent(currentGPS.lat)
        + "&lng=" + encodeURIComponent(currentGPS.lng)
        + "&t=" + new Date().getTime();

      fetch(url)
        .then(res => res.text())
        .then(text => {
          try {
            const resObj = JSON.parse(text);
            if (resObj.status === 'success') {
              setLog("✅ " + resObj.message, "#d1fae5", "#065f46", "#a7f3d0");
              
              // 1. KÍCH HOẠT LẬP TỨC: Gọi hàm tải lại dữ liệu trực tiếp bên trong giao diện HRM (GAS)
              document.getElementById('hrm-frame').contentWindow.taiLaiDuLieu();
              
              // 2. Tự động đóng cửa sổ sau 2 giây
              setTimeout(dongCuaSo, 2000); 
            } else {
              setLog("❌ " + resObj.message, "#fee2e2", "#b91c1c", "#fecaca");
            }
          } catch (err) {
            setLog("⚠️ Phản hồi từ máy chủ không hợp lệ.", "#fee2e2", "#b91c1c", "#fecaca");
          }
        })
        .catch(err => {
          setLog("❌ Lỗi kết nối đường truyền mạng.", "#fee2e2", "#b91c1c", "#fecaca");
        });
    }

    function dongCuaSo() {
      cameraModal.style.display = 'none';
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e) {}
      }
      // Tự động làm mới lại trang HRM bên trong để cập nhật bảng lịch sử chấm công mới nhất
      document.getElementById('hrm-frame').contentWindow.location.reload();
    }
  </script>
</body>
</html>
